<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  :root{--bg:#08090b;--panel:#0e1013;--line:#23272e;--ink:#e9ecef;--ink2:#a7aeb8;
        --ink3:#6b7280;--accent:#22c55e;--ember:#f0a13a;
        --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
        --mono:ui-monospace,'SF Mono',Menlo,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
       -webkit-font-smoothing:antialiased;overflow:hidden}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;
           text-transform:uppercase;color:var(--accent);opacity:.85}
  .wordmark{font-family:var(--mono);font-weight:600;letter-spacing:-.02em}
  .wordmark span{color:var(--accent)}

  body{width:440px;height:280px;display:flex;flex-direction:column;justify-content:center;
       padding:0 34px;gap:12px;
       background:radial-gradient(120% 90% at 20% 0%,rgba(34,197,94,.10),rgba(34,197,94,0) 62%),var(--bg)}
  .wordmark{font-size:27px}
  h1{font-size:19px;line-height:1.25;letter-spacing:-.02em;font-weight:620}
  p{font-size:12.5px;color:var(--ink3);line-height:1.5}
  .chips{display:flex;gap:7px;margin-top:3px}
  .chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--ink2);
        border:1px solid var(--line);border-radius:999px;padding:4px 9px}
</style></head><body>
  <div class="wordmark">vnsh<span>_</span></div>
  <h1>One workspace your AI agents<br>can read and write.</h1>
  <p>Encrypted in your browser. Gone 24h after the last edit.</p>
  <div class="chips"><span class="chip">AES-256-GCM</span><span class="chip">NO ACCOUNT</span><span class="chip">MIT</span></div>
</body></html>
