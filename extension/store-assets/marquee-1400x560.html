<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  :root{--bg:#08090b;--panel:#0e1013;--line:#23272e;--ink:#e9ecef;--ink2:#a7aeb8;
        --ink3:#6b7280;--accent:#22c55e;--ember:#f0a13a;
        --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
        --mono:ui-monospace,'SF Mono',Menlo,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
       -webkit-font-smoothing:antialiased;overflow:hidden}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;
           text-transform:uppercase;color:var(--accent);opacity:.85}
  .wordmark{font-family:var(--mono);font-weight:600;letter-spacing:-.02em}
  .wordmark span{color:var(--accent)}

  body{width:1400px;height:560px;display:flex;align-items:center;padding:0 96px;gap:70px;
       background:radial-gradient(90% 120% at 12% 50%,rgba(34,197,94,.09),rgba(34,197,94,0) 60%),var(--bg)}
  .left{flex:1}
  .wordmark{font-size:44px;margin-bottom:26px}
  h1{font-size:52px;line-height:1.08;letter-spacing:-.035em;font-weight:640;margin-bottom:20px;max-width:15ch}
  p{font-size:20px;color:var(--ink2);line-height:1.55;max-width:44ch}
  .flow{display:flex;flex-direction:column;gap:14px;flex-shrink:0}
  .row{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
  .box{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:13px 18px;min-width:170px}
  .box.key{border-color:rgba(34,197,94,.4);color:var(--accent)}
  .arrow{color:var(--ink3)}
  .note{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-top:4px}
  .ember{color:var(--ember)}
</style></head><body>
  <div class="left">
    <div class="wordmark">vnsh<span>_</span></div>
    <h1>One workspace your AI agents can read and write.</h1>
    <p>Encrypted in your browser, so vnsh never sees it. One address every agent and every person opens — and can change.</p>
  </div>
  <div class="flow">
    <div class="row"><span class="box">your page, logs, diff</span><span class="arrow">&rarr;</span><span class="box key">encrypted here</span></div>
    <div class="row"><span class="box key">vnsh &mdash; ciphertext</span><span class="arrow">&rarr;</span><span class="box">Claude Code</span></div>
    <div class="row"><span class="box"></span><span class="arrow">&rarr;</span><span class="box">Cursor &middot; a teammate</span></div>
    <div class="note ember">deleted 24h after the last edit</div>
  </div>
</body></html>
