<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380">
  <link rel="stylesheet" href="popup.css">
  <title>vnsh</title>
</head>
<body>
  <header>
    <div class="logo">vnsh</div>
    <div class="tagline">One workspace your agents can read and write</div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="share">Share</button>
    <button class="tab" data-tab="saved">Saved</button>
    <button class="tab" data-tab="history">History</button>
  </nav>

  <!-- Share Tab -->
  <section id="tab-share" class="tab-content active">
    <div class="share-input-area">
      <textarea id="share-text" placeholder="Paste text, code, or logs here..." rows="6"></textarea>
      <div class="drop-zone" id="drop-zone">
        <span>Drop file here</span>
      </div>
    </div>

    <div class="share-options">
      <div class="share-mode" role="radiogroup" aria-label="Sharing mode">
        <label class="opt-public" for="mode-agent-ready">
          <input type="radio" name="share-mode" id="mode-agent-ready" value="agent-ready" checked>
          <span>
            <strong>Agent-ready <small>Recommended</small></strong>
            <em>Any Agent or person can open it. Not encrypted; vnsh can read it.</em>
          </span>
        </label>
        <label class="opt-public" for="mode-encrypted">
          <input type="radio" name="share-mode" id="mode-encrypted" value="encrypted">
          <span>
            <strong>Encrypted</strong>
            <em>Host-blind, but the recipient needs vnsh or local code execution.</em>
          </span>
        </label>
      </div>
      <label class="opt-retention" for="retention-select">
        <span>Keep for</span>
        <select id="retention-select">
          <option value="24">24 hours</option>
          <option value="72">3 days</option>
          <option value="168">7 days</option>
        </select>
      </label>
      <p class="opt-note">Deleted when that runs out, counted from the last edit.</p>
    </div>

    <div class="share-actions">
      <button id="btn-share" class="btn primary">Share</button>
      <button id="btn-debug-bundle" class="btn accent">AI Debug Bundle</button>
      <button id="btn-screenshot" class="btn secondary">Screenshot</button>
    </div>

    <div id="share-result" class="result hidden">
      <div class="result-label" id="result-label">Agent-ready link copied!</div>
      <input id="result-url" type="text" readonly>
      <button id="btn-copy" class="btn small">Copy</button>
    </div>

    <div id="share-status" class="status hidden"></div>
  </section>

  <!-- Saved Tab -->
  <section id="tab-saved" class="tab-content">
    <div id="saved-empty" class="empty-state">
      <p>No saved snippets yet.</p>
      <p class="hint">Right-click selected text → "Save to vnsh"</p>
    </div>
    <ul id="saved-list" class="item-list"></ul>
  </section>

  <!-- History Tab -->
  <section id="tab-history" class="tab-content">
    <div id="history-empty" class="empty-state">
      <p>No shares yet.</p>
      <p class="hint">Share something to see it here.</p>
    </div>
    <ul id="history-list" class="item-list"></ul>
  </section>

  <script src="popup.js"></script>
</body>
</html>
