name = "vnsh"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Keep production entry points under the same deployment. These were previously
# dashboard-only mappings and drifted to an older Worker while workers.dev moved
# forward, which made production smoke tests exercise two different versions.
routes = [
  { pattern = "vnsh.dev", custom_domain = true },
  { pattern = "vnshcontent.dev", custom_domain = true },
  { pattern = "account.vnsh.dev", custom_domain = true },
]

# Public workspaces are served from their own registrable domain. They are
# user-written documents rendered as top-level pages, and reputation systems act
# on domains rather than paths, so one abusive page must not be able to take the
# API, the viewer and every installed client down with it. Unset this to serve
# everything from one host, which is what a self-hosted instance wants.
#
# LEGACY_PUBLIC_UNTIL keeps vnsh.dev/p/ answering for one workspace lifetime
# after the cutover so links already handed out do not break; after that the
# route is 410 forever. Not a redirect on purpose — scanners can tag the source
# of a redirect that leads to bad content.
[vars]
CONTENT_HOST = "vnshcontent.dev"
LEGACY_PUBLIC_UNTIL = "2026-08-05T14:35:07Z"
# Set only after a real message was delivered to this mailbox — a contact that
# bounces spends the one moment a reporter was willing to give, and tells a
# gateway the route is unmaintained. Verified 2026-07-29.
ABUSE_CONTACT = "mailto:abuse@vnsh.dev"
# For /api/stats to read Analytics Engine over the SQL API. An account id is an
# identifier, not a credential, so it lives here; the token it pairs with is a
# secret (`wrangler secret put CF_API_TOKEN`).
CF_ACCOUNT_ID = "f25478810829faf5ccc86f4ed9a96ef1"

# R2 bucket for blob storage. R2 customMetadata is the source of truth for blob
# expiry and payment info — the core read/write path depends on nothing else.
[[r2_buckets]]
binding = "VNSH_STORE"
bucket_name = "vnsh-store"

[[d1_databases]]
binding = "ACCOUNTS"
database_name = "vnsh-accounts"
database_id = "75cdfa36-d2e4-4489-ab8e-8fb06c0dfcd6"
migrations_dir = "migrations"

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["login@vnsh.dev"]

# Native edge rate limiters (in-colo, no storage writes). The binding only allows
# 10s or 60s windows, so limits are per-minute. namespace_id is an arbitrary unique
# positive integer per limiter.
[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 50
period = 60

# Usage analytics via Workers Analytics Engine. Dataset auto-creates on first write.
[[analytics_engine_datasets]]
binding = "VNSH_ANALYTICS"
dataset = "vnsh_events"

# Cron trigger: clean up expired R2 blobs daily at 03:00 UTC
[triggers]
crons = ["0 3 * * *"]

# Note: Static assets removed - all HTML is served inline from worker

# Environment variables (set via wrangler secret)
# STATS_TOKEN - for /api/stats endpoint authentication
# CF_ACCOUNT_ID - account id for the Analytics Engine SQL API (used by /api/stats)
# CF_API_TOKEN - token with "Account Analytics Read" to query stats
# JWT_SECRET - for signing payment tokens
# STRIPE_SECRET_KEY - for Stripe API
# LIGHTNING_API_KEY - for Lightning payments
